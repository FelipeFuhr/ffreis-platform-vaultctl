name: E2E Tests

# vaultctl's whole reason to exist is a leak-control guarantee (a secret
# must never reach a stream that could land in a session transcript). The
# //go:build e2e suite (see cmd/vaultctl/e2e_test.go) is the ONLY layer that
# proves that black-box, against the real compiled binary run as a real OS
# subprocess with its real stdout/stderr captured -- a unit test that only
# inspects an injected io.Writer cannot catch a leak that bypasses that
# writer (e.g. a stray fmt.Println/os.Stdout write). Before this workflow
# existed, `make test-e2e` had NO CI wiring at all -- it only ever ran when
# a human happened to run it locally, so a regression of exactly the kind
# this suite exists to catch could ship silently through every other gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  e2e:
    timeout-minutes: 30
    if: ${{ !github.event.pull_request.draft }}

    runs-on: ubuntu-latest
    # Mirrors integration.yml's own service container -- the e2e suite talks
    # to DYNAMODB_ENDPOINT (defaults to localhost:8000) the same way, via a
    # real subprocess exec of the compiled vaultctl binary rather than an
    # in-process call.
    services:
      dynamodb-local:
        image: docker.io/amazon/dynamodb-local:2.5.2
        ports:
          - 8000:8000
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Configure private Go module access
        env:
          GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "GOPRIVATE=github.com/FelipeFuhr/ffreis-platform-configctl"
            echo "GONOSUMCHECK=1"
          } >> "$GITHUB_ENV"
          if [ -n "$GIT_AUTH_TOKEN" ]; then
            git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.8"
          cache: true

      # `go test -tags=e2e` builds the real vaultctl binary itself (see
      # buildVaultctlBinary in e2e_test.go) and execs it as a subprocess --
      # this step does not need a separate `go build` first.
      - name: Run e2e tests
        run: go test -tags=e2e ./cmd/vaultctl/... -run 'TestE2E' -v -count=1
