name: DevOps / Go CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/**"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  mod-tidy:
    # f64a2ae... (2026-09-15) carries goprivate/GIT_AUTH_TOKEN support for
    # go-mod-tidy-check.yml -- `go mod tidy` needs to fetch the private
    # github.com/FelipeFuhr/ffreis-platform-configctl dependency to check for
    # drift; the b253b232 pin predates that feature.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mod-tidy-check.yml@f64a2ae5810fd2f661ec9f4e1d2d9e2279f54cd6
    with:
      go-version: "1.25.8"
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

  fmt:
    # gofmt never resolves modules, so it never needs goprivate -- see
    # ffreis-workflows-go's own AGENTS.md rule 7.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-fmt.yml@b253b2329a11552b6276781c56f6dc6fd1718710
    with:
      go-version: "1.25.8"
      working-directory: "."

  lint:
    needs: [fmt]
    # f64a2ae... carries goprivate/GIT_AUTH_TOKEN support for go-lint.yml --
    # golangci-lint needs to resolve the private configctl import too. That
    # pin's job also newly requires `pull-requests: read` (for
    # golangci-lint-action to fetch PR info) on top of `contents: read` --
    # the top-level `contents: read` alone isn't a superset of that, which
    # fails the whole workflow file at dispatch with a zero-job
    # startup_failure (invisible to actionlint) until granted here.
    permissions:
      contents: read
      pull-requests: read
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@f64a2ae5810fd2f661ec9f4e1d2d9e2279f54cd6
    with:
      go-version: "1.25.8"
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

  test:
    if: ${{ !github.event.pull_request.draft }}

    needs: [fmt]
    permissions:
      contents: read
      id-token: write # go-test.yml's job needs this for its (no-op here) S3 cache OIDC step
    # b253b232... (2026-04-27) tag-pins actions/checkout@v4.1.1 in go-test.yml,
    # rejected once this repo's sha_pinning_required policy is active ("must be
    # pinned to a full-length commit SHA") -- see devops-security.yml for the
    # same defect class. v1.4.0 SHA-pins it. goprivate/GIT_AUTH_TOKEN let
    # `go test` fetch the private ffreis-platform-configctl dependency.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      run-govulncheck: false
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

  integration:
    if: ${{ !github.event.pull_request.draft }}

    needs: [fmt]
    permissions:
      contents: read
      id-token: write # go-test.yml's job needs this for its (no-op here) S3 cache OIDC step
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-test.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      go-version: "1.25.8"
      working-directory: "."
      test-tags: "integration"
      run-govulncheck: false
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
