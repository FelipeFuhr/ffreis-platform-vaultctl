name: Mutation Testing

on:
  schedule:
    - cron: "0 2 1 * *"   # 1st of every month, 02:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual run (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    # f64a2ae... (2026-09-15) fixes two bugs the ed2f7d29 pin carried: (1)
    # gremlins' `unleash [path]` doesn't understand a go-list `...` pattern
    # like "./internal/..." -- it silently printed "No results to report."
    # and exited 0, a vacuous pass with zero mutants tested; the reusable
    # workflow now strips the trailing "/..." itself. (2) adds
    # goprivate/GIT_AUTH_TOKEN support -- gremlins' own `go test` needs to
    # fetch the private ffreis-platform-configctl dependency.
    # IMPORTANT: the ed2f7d29 pin hardcoded `runs-on: ubuntu-latest` (no
    # `runner` input existed yet); f64a2ae's version added one that
    # DEFAULTS TO SELF-HOSTED (`["self-hosted","local"]`) -- verified
    # directly against each pin's own source. This repo has zero
    # self-hosted runners registered (a personal-account repo, not
    # reachable from ffreis-org's pool), so without the override below this
    # job queues forever and never runs, silently -- especially dangerous
    # here since it only ever fires on a monthly schedule/manual dispatch,
    # so a silently-hung run could go unnoticed for a long time.
    # packages was "./internal/..." only -- cmd/vaultctl's cobra command
    # wiring (which env var gets checked, whether a value gets printed) is
    # exactly the security logic this vault exists to protect, not
    # low-value glue, so it must be mutation-tested too. Mirrors the
    # Makefile's own MUTATION_PACKAGES default.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-mutation.yml@f64a2ae5810fd2f661ec9f4e1d2d9e2279f54cd6
    with:
      runner: '["ubuntu-latest"]'
      packages: "./internal/... ./cmd/vaultctl/..."
      threshold: 60
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

  notify-failure:
    needs: [mutation]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ [CI] ${context.workflow} failed (${new Date().toISOString().split('T')[0]})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
