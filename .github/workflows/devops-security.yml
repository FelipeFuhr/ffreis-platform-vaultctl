name: DevOps / Security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 5 25-31 * 0"  # last Sunday of month, 05:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  preflight:
    # Schedule/dispatch: skip if no security-relevant files changed since last successful scan.
    # PR/push events skip this job; security jobs run unconditionally on those triggers.
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Check if scan needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_SHA=$(gh run list \
            --workflow "devops-security.yml" \
            --status success \
            --event schedule \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""' 2>/dev/null || echo "")
          if [[ -z "$LAST_SHA" || "$LAST_SHA" == "null" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_SHA" HEAD 2>/dev/null | \
            grep -cE '(Cargo\.(toml|lock)|go\.(mod|sum)|package(-lock)?\.json|yarn\.lock|requirements.*\.txt|Pipfile(\.lock)?|pyproject\.toml|pom\.xml|build\.gradle|\.github/)' \
            || echo 0)
          if [[ "$CHANGED" -gt 0 ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${CHANGED} security-relevant file(s) changed — running scan"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No security-relevant changes since last scan — skipping"
          fi

  gitleaks:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-gitleaks.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da
    with:
      working-directory: "."
      scan-history: true
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  codeql:
    needs: preflight
    if: |
      always() && github.event_name != 'pull_request' && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-codeql.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da
    with:
      languages: "go"
      source-root: "."

  govulncheck:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
    # b253b232... (2026-04-27) predates ffreis-workflows-go@b7d67ce (2026-04-29,
    # "bump actions/checkout from 4.1.1 to 6.0.2" for THIS file specifically) --
    # at that stale pin go-security.yml's checkout step is tag-pinned, which
    # this repo's sha_pinning_required policy rejects outright ("The action
    # actions/checkout@v4.1.1 is not allowed ... must be pinned to a full-length
    # commit SHA"). v1.4.0 carries the fix; matches ffreis-platform-configctl.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-security.yml@86fd6e3b73fbe6d4f83280ef2661605d441a20e3 # v1.4.0
    with:
      # go-security.yml's govulncheck-action always installs the LATEST
      # govulncheck release (no version-pin input exposed) with
      # check-latest: true; golang.org/x/vuln v1.8.0 now requires go
      # >=1.26.0, and actions/setup-go's runner has GOTOOLCHAIN=local (no
      # auto-upgrade), so the fleet's usual 1.25.8 pin fails outright with
      # "requires go >= 1.26.0 (running go 1.25.8; GOTOOLCHAIN=local)" --
      # a known, fleet-wide (~30 repos) issue unrelated to this repo's own
      # code. Scoped fix: this ONE job (govulncheck-action's own internal
      # setup-go, not this repo's real toolchain) uses 1.26 instead.
      go-version: "1.26"
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}

  semgrep:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-semgrep-sarif.yml@b253b2329a11552b6276781c56f6dc6fd1718710
    with:
      working-directory: "."
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  trivy-fs:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scan-trivy-fs.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da
    with:
      scan-ref: "."
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  grype-fs:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scan-grype-fs.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da
    with:
      path: "."
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  osv:
    needs: preflight
    if: |
      always() && (
        needs.preflight.result != 'success' ||
        needs.preflight.outputs.should_run == 'true'
      )
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-osv-scanner.yml@8ff19efd329b76bce5ff5b98074b9aec74b239da
    with:
      working-directory: "."
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}


  lint:
    # That pin's job requires `pull-requests: read` (for golangci-lint-action
    # to fetch PR info) on top of `contents: read` -- omitting it fails the
    # whole workflow file at dispatch with a zero-job startup_failure,
    # invisible to actionlint (see devops-go-ci.yml's own lint job for the
    # same defect class, hit first there).
    permissions:
      contents: read
      pull-requests: read
    # f64a2ae... carries goprivate/GIT_AUTH_TOKEN support -- golangci-lint
    # needs to resolve the private ffreis-platform-configctl import.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-lint.yml@f64a2ae5810fd2f661ec9f4e1d2d9e2279f54cd6
    with:
      go-version: "1.25.8"
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
