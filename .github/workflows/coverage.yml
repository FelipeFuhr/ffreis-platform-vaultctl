name: Code Coverage (Codecov)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true

jobs:
  coverage:
    if: ${{ !github.event.pull_request.draft }}

    # f64a2ae... (2026-09-15) carries goprivate/GIT_AUTH_TOKEN support --
    # `go test` needs to fetch the private ffreis-platform-configctl
    # dependency; the e9b9cc0c pin predates that feature.
    uses: FelipeFuhr/ffreis-workflows-go/.github/workflows/go-coverage.yml@f64a2ae5810fd2f661ec9f4e1d2d9e2279f54cd6
    with:
      go-version: "1.25.8"
      working-directory: "."
      goprivate: "github.com/FelipeFuhr/ffreis-platform-configctl"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      GIT_AUTH_TOKEN: ${{ secrets.FLEET_READ_TOKEN }}
